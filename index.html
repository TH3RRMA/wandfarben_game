<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandfarben – Das Ziegelwand-Spiel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <header class="hud">
      <div class="stat">
        <span class="label">Punkte</span>
        <span id="score">0</span>
      </div>
      <div class="stat">
        <span class="label">Phase</span>
        <span id="phase">1</span>
      </div>
      <div class="stat">
        <span class="label">Zeit</span>
        <span id="time">30s</span>
      </div>
      <div class="stat">
        <span class="label">Tempo</span>
        <span id="tempo">1.6s</span>
      </div>
      <div class="stat">
        <span class="label">Fehler</span>
        <span id="misses">0</span>
      </div>
    </header>

    <div class="progress">
      <div id="progress-fill"></div>
    </div>

    <div id="wall" class="wall" aria-label="Ziegelwand"></div>
  </div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1 id="menu-title">Wandfarben</h1>
      <p id="menu-text"></p>
      <div class="highscores">
        <h2>Beste Ergebnisse</h2>
        <div id="highscores"></div>
      </div>
      <button id="menu-btn">Start</button>
    </div>
  </div>

  <div id="shop" class="overlay hidden">
    <div class="panel shop-panel">
      <h1>Phase <span id="shop-phase">1</span> geschafft!</h1>
      <p id="shop-subtitle"></p>
      <div id="shop-cards" class="shop-cards"></div>
      <button id="next-btn">Nächste Phase</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
